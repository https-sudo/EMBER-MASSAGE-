<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember Massage | Luxury Wellness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html { scroll-behavior: smooth; }
        body { background-color: #000; color: #fff; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <section class="relative h-[80vh] flex items-center justify-center bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1515377905703-c4788e51af15?q=80&w=1400');">
        <div class="absolute inset-0 bg-black/70"></div>
        <div class="relative z-10 text-center px-6">
            <h1 class="text-5xl md:text-7xl font-black mb-6 italic">Ember Massage</h1>
            <p class="text-lg text-gray-300 mb-8 font-light tracking-wide">Luxury Wellness & Healing Experience</p>
            <a href="#booking" class="bg-amber-500 text-black px-10 py-4 rounded-2xl font-bold uppercase tracking-widest hover:bg-amber-400 transition-colors">Book Appointment</a>
        </div>
    </section>

    <section id="booking" class="py-20 px-6 bg-amber-500 text-black">
        <div class="max-w-2xl mx-auto">
            <div class="bg-black text-white p-8 md:p-12 rounded-[2.5rem] shadow-2xl">
                <h2 class="text-3xl font-bold mb-8 text-center uppercase tracking-tighter text-amber-500">Secure Your Slot</h2>
                
                <form class="space-y-6">
                    <div class="glass p-5 rounded-2xl mb-6">
                        <p class="text-gray-400 text-xs uppercase font-bold mb-2 tracking-widest">Deposit Required</p>
                        <p class="text-sm text-gray-300">A 60% deposit is mandatory to confirm. Remaining balance is paid in person.</p>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Full Name</label>
                        <input type="text" id="userName" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-4 outline-none focus:border-amber-500 transition-colors" placeholder="Enter your name">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Preferred Service</label>
                        <select id="userService" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-4 outline-none text-white cursor-pointer">
                            <option>Swedish Massage — $100 (Deposit: $60)</option>
                            <option>Deep Tissue Massage — $120 (Deposit: $72)</option>
                            <option>Hot Stone Massage — $150 (Deposit: $90)</option>
                            <option>Aromatherapy Massage — $130 (Deposit: $78)</option>
                            <option>VIP Premium Experience — $350 (Deposit: $210)</option>
                        </select>
                    </div>

                    <button type="button" onclick="sendToTelegram()" class="w-full bg-amber-500 text-black font-black py-5 rounded-2xl uppercase tracking-widest text-lg shadow-xl hover:scale-[1.02] transition-transform">
                        Pay Deposit via Telegram
                    </button>

                    <button type="button" onclick="openSmartsupp()" class="w-full border border-white/20 text-white font-bold py-4 rounded-2xl uppercase text-xs mt-2 hover:bg-white/5 transition-colors">
                        Open Live Chat
                    </button>
                </form>
            </div>
        </div>
    </section>

    <footer class="bg-black py-16 text-center border-t border-white/5">
        <h3 class="text-2xl font-bold mb-4 uppercase tracking-widest text-white">Ember Massage</h3>
        <p class="text-gray-500 text-sm italic mb-1">📍 St. Thomas, US Virgin Islands</p>
        <p class="text-gray-500 text-sm italic">✉️ embermassage29@gmail.com</p>
    </footer>

    <script>
        // TELEGRAM REDIRECT
        function sendToTelegram() {
            const name = document.getElementById('userName').value;
            const service = document.getElementById('userService').value;
            if (!name) { alert("Please enter your name!"); return; }
            
            const message = `Hello Ember! My name is ${name}. I want to book the ${service}. I am ready to pay my deposit.`;
            window.open(`https://t.me/Emberblake927?text=${encodeURIComponent(message)}`, '_blank');
        }

        // SMARTSUPP ACTION
        function openSmartsupp() {
            if (window.smartsupp) {
                window.smartsupp('chat:open');
            } else {
                alert("Live Chat is loading. Please wait a few seconds or use Telegram.");
            }
        }
    </script>

    <script type="text/javascript">
    var _smartsupp = _smartsupp || {};
    _smartsupp.key = 'e5cedf5dc7c55c77efac3f0637f12cb8d18bad23';
    window.smartsupp||(function(d) {
        var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
        s=d.getElementsByTagName('script')[0];c=d.createElement('script');
        c.type='text/javascript';c.charset='utf-8';c.async=true;
        c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
    })(document);
    </script>

</body>
</html>
